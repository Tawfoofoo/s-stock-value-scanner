name: Scheduled US stock scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 2-6'

permissions:
  contents: write

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Run scanner
        env:
          BATCH_SIZE: '25'
          SCAN_DELAY: '0.5'
        run: |
          echo "0" > data/scan_state.txt

          completed=false

          for batch in $(seq 1 30); do
            echo "Running batch $batch"

            python scan_batch.py

            next_index=$(cat data/scan_state.txt)
            echo "Next index: $next_index"

            if [ "$next_index" = "0" ]; then
              echo "Full S&P 500 scan completed"
              completed=true
              break
            fi

            sleep 2
          done

          if [ "$completed" != "true" ]; then
            echo "Full scan did not complete"
            exit 1
          fi


      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_scan.csv data/scan_state.txt
          git add -f data/scan_errors.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update automated stock scan"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "Successfully pushed scan results"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "Failed to push scan results"
          exit 1

      - name: Send LINE alert
        if: success()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_MIN_MOS: '15'
        run: python line_alert.py

      - name: Save LINE alert state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/line_alert_state.json

          if git diff --cached --quiet; then
            echo "No alert state changes"
            exit 0
          fi

          git commit -m "Update LINE alert state"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "Successfully saved LINE alert state"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "Failed to save LINE alert state"
          exit 1

